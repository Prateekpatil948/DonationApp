[flake8]
max-line-length = 100
exclude = .git,__pycache__,migrations,.venv,venv,staticfiles,media
extend-ignore = E203,W503
max-complexity = 12

[coverage:run]
source = apps,core,services,utils
omit =
    */migrations/*
    */tests/*
    manage.py
    */apps.py

[coverage:report]
fail_under = 90
show_missing = true
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if TYPE_CHECKING:
