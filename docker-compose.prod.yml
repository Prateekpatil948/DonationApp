services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    command:
      [
        "gunicorn",
        "config.wsgi:application",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "3",
        "--access-logfile",
        "-",
        "--error-logfile",
        "-",
      ]
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      # REDIS_URL: redis://redis:6379/0
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - log_data:/app/logs
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      # redis:
      #   condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-ra_backend}
      POSTGRES_USER: ${DATABASE_USER:-ra_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ra_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-ra_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # redis:
  #   image: redis:7-alpine
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped

  # nginx:
  #   image: nginx:1.27-alpine
  #   volumes:
  #     - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - static_data:/app/staticfiles:ro
  #     - media_data:/app/media:ro
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

volumes:
  postgres_data:
  # redis_data:
  static_data:
  media_data:
  log_data:
