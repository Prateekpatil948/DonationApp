name: Deploy DonationApp to Oracle Cloud

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script_stop: true

          script: |

            set -e

            echo "=========================================="
            echo "      DONATION APP DEPLOYMENT"
            echo "=========================================="

            echo ""
            echo "Hostname:"
            hostname

            echo ""
            echo "Current user:"
            id -un

            echo ""
            echo "User ID:"
            id -u


            # ==========================================
            # APPLICATION DIRECTORY
            # ==========================================

            APP_DIR="/donation"

            echo ""
            echo "=========================================="
            echo "APPLICATION DIRECTORY"
            echo "=========================================="

            echo "Application directory:"
            echo "$APP_DIR"


            # ==========================================
            # DOCKER
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING DOCKER"
            echo "=========================================="

            sudo docker --version
            sudo docker compose version

            echo ""
            echo "Docker service:"
            sudo systemctl is-active docker


            # ==========================================
            # PREPARE /DONATION
            # ==========================================

            echo ""
            echo "=========================================="
            echo "PREPARING /DONATION"
            echo "=========================================="

            if [ ! -d "$APP_DIR" ]; then

                echo "/donation does not exist."

                echo "Creating /donation..."

                sudo mkdir -p "$APP_DIR"

                echo "/donation created."

            else

                echo "/donation already exists."

            fi


            # ==========================================
            # GIT
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING GIT"
            echo "=========================================="

            if ! command -v git >/dev/null 2>&1; then

                echo "Git is not installed."

                echo "Installing Git..."

                sudo apt-get update
                sudo apt-get install -y git

            fi

            echo "git version:"
            git --version


            # ==========================================
            # CLONE REPOSITORY
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING GIT REPOSITORY"
            echo "=========================================="

            if [ ! -d "$APP_DIR/.git" ]; then

                echo "Repository not found."

                echo "Cloning DonationApp into /donation..."

                sudo rm -rf "$APP_DIR"

                sudo git clone \
                    https://github.com/Prateekpatil948/DonationApp.git \
                    "$APP_DIR"

                echo ""
                echo "Repository cloned successfully."

            else

                echo "Repository already exists."

                echo "Updating repository..."

                cd "$APP_DIR"

                sudo git fetch origin

                sudo git reset --hard origin/main

                echo ""
                echo "Repository updated successfully."

            fi


            # ==========================================
            # FIX OWNERSHIP
            # ==========================================

            echo ""
            echo "=========================================="
            echo "SETTING PROJECT PERMISSIONS"
            echo "=========================================="

            sudo chown -R "$(id -u):$(id -g)" "$APP_DIR"

            echo "Project ownership updated."


            # ==========================================
            # ENTER PROJECT
            # ==========================================

            cd "$APP_DIR"

            echo ""
            echo "=========================================="
            echo "PROJECT INFORMATION"
            echo "=========================================="

            echo "Current directory:"
            pwd

            echo ""
            echo "Git remote:"
            git remote -v

            echo ""
            echo "Latest commit:"
            git log -1 --oneline

            echo ""
            echo "Project files:"
            ls -la


            # ==========================================
            # DOCKER COMPOSE
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING DOCKER COMPOSE"
            echo "=========================================="

            if [ ! -f "$APP_DIR/docker-compose.yml" ]; then

                echo "ERROR:"
                echo "docker-compose.yml was not found."

                exit 1

            fi

            echo "docker-compose.yml found."


            # ==========================================
            # ENVIRONMENT FILE
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING ENVIRONMENT FILE"
            echo "=========================================="

            if [ ! -f "$APP_DIR/.env" ]; then

                echo ".env does not exist."

                echo "Creating .env..."

                sudo touch "$APP_DIR/.env"

                sudo chown "$(id -u):$(id -g)" "$APP_DIR/.env"

                echo ".env created."

            else

                echo ".env already exists."

            fi


            # ==========================================
            # DOCKER COMPOSE VALIDATION
            # ==========================================

            echo ""
            echo "=========================================="
            echo "VALIDATING DOCKER COMPOSE"
            echo "=========================================="

            sudo docker compose config


            # ==========================================
            # STOP OLD CONTAINERS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "STOPPING OLD CONTAINERS"
            echo "=========================================="

            sudo docker compose down


            # ==========================================
            # BUILD
            # ==========================================

            echo ""
            echo "=========================================="
            echo "BUILDING DOCKER IMAGES"
            echo "=========================================="

            sudo docker compose build --pull


            # ==========================================
            # START
            # ==========================================

            echo ""
            echo "=========================================="
            echo "STARTING CONTAINERS"
            echo "=========================================="

            sudo docker compose up -d


            # ==========================================
            # WAIT
            # ==========================================

            echo ""
            echo "=========================================="
            echo "WAITING FOR CONTAINERS"
            echo "=========================================="

            sleep 15


            # ==========================================
            # CONTAINER STATUS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CONTAINER STATUS"
            echo "=========================================="

            sudo docker compose ps


            # ==========================================
            # BACKEND LOGS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "BACKEND LOGS"
            echo "=========================================="

            sudo docker compose logs --tail=100 backend


            # ==========================================
            # MIGRATIONS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "RUNNING MIGRATIONS"
            echo "=========================================="

            sudo docker compose exec -T backend \
                python manage.py migrate --noinput


            # ==========================================
            # STATIC FILES
            # ==========================================

            echo ""
            echo "=========================================="
            echo "COLLECTING STATIC FILES"
            echo "=========================================="

            sudo docker compose exec -T backend \
                python manage.py collectstatic --noinput


            # ==========================================
            # FINAL STATUS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "FINAL CONTAINER STATUS"
            echo "=========================================="

            sudo docker compose ps


            # ==========================================
            # SUCCESS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "       DEPLOYMENT SUCCESSFUL"
            echo "=========================================="

            echo ""
            echo "Application directory:"
            echo "$APP_DIR"

            echo ""
            echo "Application URL:"
            echo "http://140.245.238.244:8002/"
