name: Deploy DonationApp to Oracle Cloud

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: donation-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script_stop: true

          script: |

            set -e

            echo "=================================================="
            echo "       DONATION APP - PRODUCTION DEPLOYMENT"
            echo "=================================================="


            # ==================================================
            # CONFIGURATION
            # ==================================================

            APP_DIR="/home/ubuntu/donation"
            REPO_URL="https://github.com/Prateekpatil948/DonationApp.git"
            BRANCH="main"


            # ==================================================
            # SERVER
            # ==================================================

            echo ""
            echo "=================================================="
            echo "SERVER INFORMATION"
            echo "=================================================="

            echo "Hostname:"
            hostname

            echo ""
            echo "User:"
            id -un

            echo ""
            echo "Application directory:"
            echo "$APP_DIR"


            # ==================================================
            # DEPLOYMENT LOCK
            # ==================================================

            echo ""
            echo "=================================================="
            echo "DEPLOYMENT LOCK"
            echo "=================================================="

            exec 9>/tmp/donation-deployment.lock

            if ! flock -n 9; then
                echo "Another deployment is already running."
                exit 1
            fi

            echo "Deployment lock acquired."


            # ==================================================
            # DOCKER
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CHECKING DOCKER"
            echo "=================================================="

            sudo docker --version
            sudo docker compose version

            if ! sudo systemctl is-active --quiet docker; then
                echo "Docker is not running."
                echo "Starting Docker..."
                sudo systemctl start docker
            fi

            echo "Docker is running."


            # ==================================================
            # APPLICATION DIRECTORY
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CHECKING APPLICATION DIRECTORY"
            echo "=================================================="

            if [ ! -d "$APP_DIR" ]; then
                echo "ERROR: $APP_DIR does not exist."
                exit 1
            fi

            echo "Application directory exists."


            # ==================================================
            # GIT
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CHECKING GIT"
            echo "=================================================="

            if ! command -v git >/dev/null 2>&1; then
                echo "Git is not installed."
                sudo apt-get update
                sudo apt-get install -y git
            fi

            git --version


            # ==================================================
            # ENTER PROJECT
            # ==================================================

            cd "$APP_DIR"

            echo ""
            echo "Current directory:"
            pwd


            # ==================================================
            # CHECK REPOSITORY
            # ==================================================

            if [ ! -d ".git" ]; then
                echo "ERROR: Git repository not found."
                exit 1
            fi

            echo "Git repository found."


            # ==================================================
            # CHECK .ENV
            # ==================================================

            echo ""
            echo "=================================================="
            echo "PROTECTING PRODUCTION ENVIRONMENT"
            echo "=================================================="

            if [ ! -f ".env" ]; then
                echo "ERROR: Production .env does not exist."
                exit 1
            fi

            echo ".env exists."
            echo ".env will NOT be modified."


            # ==================================================
            # UPDATE CODE
            # ==================================================

            echo ""
            echo "=================================================="
            echo "UPDATING SOURCE CODE"
            echo "=================================================="

            git fetch origin "$BRANCH"

            git reset --hard "origin/$BRANCH"

            echo "Source code updated."


            # ==================================================
            # VERIFY .ENV
            # ==================================================

            if [ ! -f ".env" ]; then
                echo "ERROR: .env was removed unexpectedly."
                exit 1
            fi

            echo ".env is still present."


            # ==================================================
            # SHOW COMMIT
            # ==================================================

            echo ""
            echo "=================================================="
            echo "DEPLOYED COMMIT"
            echo "=================================================="

            git log -1 --oneline


            # ==================================================
            # DOCKER COMPOSE
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CHECKING DOCKER COMPOSE"
            echo "=================================================="

            if [ ! -f "docker-compose.yml" ]; then
                echo "ERROR: docker-compose.yml not found."
                exit 1
            fi

            echo "docker-compose.yml found."


            # ==================================================
            # VALIDATE COMPOSE
            # ==================================================

            echo ""
            echo "=================================================="
            echo "VALIDATING DOCKER COMPOSE"
            echo "=================================================="

            sudo docker compose config >/dev/null

            echo "Docker Compose configuration is valid."


            # ==================================================
            # BUILD
            # ==================================================

            echo ""
            echo "=================================================="
            echo "BUILDING DOCKER IMAGE"
            echo "=================================================="

            sudo docker compose build --pull


            # ==================================================
            # DEPLOY
            # ==================================================

            echo ""
            echo "=================================================="
            echo "STARTING APPLICATION"
            echo "=================================================="

            sudo docker compose up -d --remove-orphans


            # ==================================================
            # WAIT
            # ==================================================

            echo ""
            echo "Waiting for containers to start..."

            sleep 10


            # ==================================================
            # STATUS
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CONTAINER STATUS"
            echo "=================================================="

            sudo docker compose ps


            # ==================================================
            # MIGRATIONS
            # ==================================================

            echo ""
            echo "=================================================="
            echo "RUNNING MIGRATIONS"
            echo "=================================================="

            sudo docker compose exec -T backend \
                python manage.py migrate --noinput

            echo "Migrations completed."


            # ==================================================
            # STATIC FILES
            # ==================================================

            echo ""
            echo "=================================================="
            echo "COLLECTING STATIC FILES"
            echo "=================================================="

            sudo docker compose exec -T backend \
                python manage.py collectstatic --noinput

            echo "Static files collected."


            # ==================================================
            # FINAL STATUS
            # ==================================================

            echo ""
            echo "=================================================="
            echo "FINAL CONTAINER STATUS"
            echo "=================================================="

            sudo docker compose ps


            # ==================================================
            # FINAL LOGS
            # ==================================================

            echo ""
            echo "=================================================="
            echo "RECENT BACKEND LOGS"
            echo "=================================================="

            sudo docker compose logs --tail=30 backend


            # ==================================================
            # SUCCESS
            # ==================================================

            echo ""
            echo "=================================================="
            echo "       DEPLOYMENT SUCCESSFUL"
            echo "=================================================="

            echo ""
            echo "Application:"
            echo "$APP_DIR"

            echo ""
            echo "URL:"
            echo "http://140.245.238.244:8002/"

            echo ""
            echo "Production .env:"
            echo "PRESERVED"

            echo ""
            echo "Deployment completed successfully."
