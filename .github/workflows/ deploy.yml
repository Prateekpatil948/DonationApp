name: Deploy DonationApp to Oracle Cloud

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script_stop: true

          script: |

            set -e

            echo "=========================================="
            echo "       DONATION APP DEPLOYMENT"
            echo "=========================================="

            echo ""
            echo "Hostname:"
            hostname

            echo ""
            echo "SSH User:"
            whoami

            echo ""
            echo "Home Directory:"
            echo "$HOME"


            # ==========================================
            # DOCKER CHECK
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING DOCKER"
            echo "=========================================="

            sudo docker --version
            sudo docker compose version

            if ! sudo systemctl is-active --quiet docker; then
                echo "Docker is not running."
                echo "Starting Docker..."
                sudo systemctl start docker
            fi

            echo "Docker is running."


            # ==========================================
            # APPLICATION DIRECTORY
            # ==========================================

            echo ""
            echo "=========================================="
            echo "PREPARING APPLICATION DIRECTORY"
            echo "=========================================="

            APP_DIR="$HOME/donation"

            echo "Application directory:"
            echo "$APP_DIR"

            mkdir -p "$APP_DIR"

            echo "Directory created/verified."


            # ==========================================
            # CLONE OR UPDATE REPOSITORY
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING GIT REPOSITORY"
            echo "=========================================="

            if [ ! -d "$APP_DIR/.git" ]; then

                echo "Repository does not exist."
                echo "Cloning DonationApp..."

                rm -rf "$APP_DIR"

                git clone \
                  https://github.com/Prateekpatil948/DonationApp.git \
                  "$APP_DIR"

                echo "Repository cloned successfully."

            else

                echo "Repository already exists."
                echo "Updating repository..."

                cd "$APP_DIR"

                git fetch origin

                git reset --hard origin/main

                echo "Repository updated."

            fi


            # ==========================================
            # ENTER APPLICATION
            # ==========================================

            cd "$APP_DIR"

            echo ""
            echo "=========================================="
            echo "APPLICATION INFORMATION"
            echo "=========================================="

            echo "Path:"
            pwd

            echo ""
            echo "Files:"
            ls -la


            # ==========================================
            # UPDATE CODE
            # ==========================================

            echo ""
            echo "=========================================="
            echo "UPDATING CODE"
            echo "=========================================="

            git fetch origin

            git reset --hard origin/main

            echo ""
            echo "Latest commit:"
            git log -1 --oneline


            # ==========================================
            # DOCKER COMPOSE CHECK
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING DOCKER COMPOSE"
            echo "=========================================="

            if [ ! -f docker-compose.yml ]; then
                echo "ERROR: docker-compose.yml not found!"
                exit 1
            fi

            echo "docker-compose.yml found."


            # ==========================================
            # ENV FILE
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING ENVIRONMENT FILE"
            echo "=========================================="

            if [ ! -f .env ]; then
                echo ".env does not exist."
                echo "Creating empty .env file..."
                touch .env
            else
                echo ".env already exists."
            fi


            # ==========================================
            # VALIDATE COMPOSE
            # ==========================================

            echo ""
            echo "=========================================="
            echo "VALIDATING DOCKER COMPOSE"
            echo "=========================================="

            sudo docker compose config


            # ==========================================
            # STOP OLD CONTAINERS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "STOPPING OLD CONTAINERS"
            echo "=========================================="

            sudo docker compose down


            # ==========================================
            # BUILD
            # ==========================================

            echo ""
            echo "=========================================="
            echo "BUILDING DOCKER IMAGES"
            echo "=========================================="

            sudo docker compose build --pull


            # ==========================================
            # START
            # ==========================================

            echo ""
            echo "=========================================="
            echo "STARTING CONTAINERS"
            echo "=========================================="

            sudo docker compose up -d


            # ==========================================
            # WAIT
            # ==========================================

            echo ""
            echo "Waiting for containers..."

            sleep 15


            # ==========================================
            # STATUS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CONTAINER STATUS"
            echo "=========================================="

            sudo docker compose ps


            # ==========================================
            # BACKEND LOGS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "BACKEND LOGS"
            echo "=========================================="

            sudo docker compose logs --tail=100 backend


            # ==========================================
            # DATABASE MIGRATIONS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "RUNNING MIGRATIONS"
            echo "=========================================="

            sudo docker compose exec -T backend \
              python manage.py migrate --noinput


            # ==========================================
            # STATIC FILES
            # ==========================================

            echo ""
            echo "=========================================="
            echo "COLLECTING STATIC FILES"
            echo "=========================================="

            sudo docker compose exec -T backend \
              python manage.py collectstatic --noinput


            # ==========================================
            # FINAL STATUS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "FINAL STATUS"
            echo "=========================================="

            sudo docker compose ps


            echo ""
            echo "=========================================="
            echo "    DEPLOYMENT SUCCESSFUL"
            echo "=========================================="
