name: Deploy DonationApp to Oracle Cloud

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: donation-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # DEPLOY
      # ============================================================

      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22

          script_stop: true

          script: |

            set -e

            echo "=================================================="
            echo "       DONATION APP - PRODUCTION DEPLOYMENT"
            echo "=================================================="


            # ==================================================
            # CONFIGURATION
            # ==================================================

            APP_DIR="/home/ubuntu/donation"
            REPO_URL="https://github.com/Prateekpatil948/DonationApp.git"
            BRANCH="main"


            # ==================================================
            # SERVER INFORMATION
            # ==================================================

            echo ""
            echo "=================================================="
            echo "SERVER INFORMATION"
            echo "=================================================="

            echo "Hostname:"
            hostname

            echo ""
            echo "Current user:"
            id -un

            echo ""
            echo "User ID:"
            id -u

            echo ""
            echo "Application directory:"
            echo "$APP_DIR"


            # ==================================================
            # DEPLOYMENT LOCK
            # ==================================================

            echo ""
            echo "=================================================="
            echo "DEPLOYMENT LOCK"
            echo "=================================================="

            exec 9>/tmp/donation-deployment.lock

            if ! flock -n 9; then
                echo "Another deployment is already running."
                exit 1
            fi

            echo "Deployment lock acquired."


            # ==================================================
            # CHECK DOCKER
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CHECKING DOCKER"
            echo "=================================================="

            sudo docker --version
            sudo docker compose version

            if ! sudo systemctl is-active --quiet docker; then
                echo "Docker is not running."
                echo "Starting Docker..."
                sudo systemctl start docker
            fi

            echo "Docker is running."


            # ==================================================
            # CHECK APPLICATION DIRECTORY
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CHECKING APPLICATION DIRECTORY"
            echo "=================================================="

            if [ ! -d "$APP_DIR" ]; then

                echo "ERROR: Application directory does not exist:"
                echo "$APP_DIR"

                echo ""
                echo "This workflow intentionally does not create or"
                echo "modify the application directory automatically."

                exit 1

            fi

            echo "Application directory exists."


            # ==================================================
            # CHECK GIT
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CHECKING GIT"
            echo "=================================================="

            if ! command -v git >/dev/null 2>&1; then

                echo "Git is not installed."

                sudo apt-get update
                sudo apt-get install -y git

            fi

            git --version


            # ==================================================
            # ENTER APPLICATION
            # ==================================================

            cd "$APP_DIR"

            echo ""
            echo "Current directory:"
            pwd


            # ==================================================
            # CHECK REPOSITORY
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CHECKING REPOSITORY"
            echo "=================================================="

            if [ ! -d ".git" ]; then

                echo "ERROR: Git repository does not exist."
                echo "$APP_DIR/.git"

                exit 1

            fi

            echo "Git repository found."


            # ==================================================
            # CHECK REMOTE
            # ==================================================

            echo ""
            echo "Git remote:"

            git remote -v


            # ==================================================
            # CHECK PRODUCTION ENV
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CHECKING PRODUCTION ENVIRONMENT"
            echo "=================================================="

            if [ ! -f ".env" ]; then

                echo ""
                echo "ERROR: Production .env file is missing."
                echo ""
                echo "Expected:"
                echo "$APP_DIR/.env"
                echo ""

                exit 1

            fi

            echo "Production .env exists."


            # ==================================================
            # UPDATE SOURCE CODE
            # ==================================================

            echo ""
            echo "=================================================="
            echo "UPDATING SOURCE CODE"
            echo "=================================================="

            echo "Fetching latest code..."

            git fetch origin "$BRANCH"


            echo ""
            echo "Resetting application to origin/$BRANCH..."

            git reset --hard "origin/$BRANCH"


            # ==================================================
            # IMPORTANT:
            # .env is NOT touched.
            # ==================================================

            echo ""
            echo "Production .env preserved."


            # ==================================================
            # VERIFY ENV AFTER GIT UPDATE
            # ==================================================

            echo ""
            echo "=================================================="
            echo "VERIFYING PRODUCTION ENV"
            echo "=================================================="

            if [ ! -f ".env" ]; then

                echo "ERROR: .env disappeared after Git update."

                exit 1

            fi

            echo ".env is still present."


            # ==================================================
            # CHECK DOCKER COMPOSE
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CHECKING DOCKER COMPOSE"
            echo "=================================================="

            if [ ! -f "docker-compose.yml" ]; then

                echo "ERROR: docker-compose.yml not found."

                exit 1

            fi

            echo "docker-compose.yml found."


            # ==================================================
            # VALIDATE COMPOSE
            # ==================================================

            echo ""
            echo "=================================================="
            echo "VALIDATING DOCKER COMPOSE"
            echo "=================================================="

            sudo docker compose config >/dev/null

            echo "Docker Compose configuration is valid."


            # ==================================================
            # BUILD
            # ==================================================

            echo ""
            echo "=================================================="
            echo "BUILDING DOCKER IMAGES"
            echo "=================================================="

            sudo docker compose build --pull


            # ==================================================
            # START / UPDATE CONTAINERS
            # ==================================================

            echo ""
            echo "=================================================="
            echo "STARTING / UPDATING CONTAINERS"
            echo "=================================================="

            sudo docker compose up -d --remove-orphans


            # ==================================================
            # WAIT
            # ==================================================

            echo ""
            echo "=================================================="
            echo "WAITING FOR CONTAINERS"
            echo "=================================================="

            sleep 15


            # ==================================================
            # STATUS
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CONTAINER STATUS"
            echo "=================================================="

            sudo docker compose ps


            # ==================================================
            # BACKEND LOGS
            # ==================================================

            echo ""
            echo "=================================================="
            echo "BACKEND LOGS"
            echo "=================================================="

            sudo docker compose logs --tail=100 backend


            # ==================================================
            # DATABASE MIGRATIONS
            # ==================================================

            echo ""
            echo "=================================================="
            echo "RUNNING DATABASE MIGRATIONS"
            echo "=================================================="

            sudo docker compose exec -T backend \
              python manage.py migrate --noinput

            echo "Migrations completed."


            # ==================================================
            # STATIC FILES
            # ==================================================

            echo ""
            echo "=================================================="
            echo "COLLECTING STATIC FILES"
            echo "=================================================="

            sudo docker compose exec -T backend \
              python manage.py collectstatic --noinput

            echo "Static files collected."


            # ==================================================
            # FINAL STATUS
            # ==================================================

            echo ""
            echo "=================================================="
            echo "FINAL CONTAINER STATUS"
            echo "=================================================="

            sudo docker compose ps


            # ==================================================
            # APPLICATION HEALTH CHECK
            # ==================================================

            echo ""
            echo "=================================================="
            echo "APPLICATION HEALTH CHECK"
            echo "=================================================="

            echo "Checking backend container..."

            BACKEND_CONTAINER=$(sudo docker compose ps -q backend)

            if [ -z "$BACKEND_CONTAINER" ]; then

                echo "ERROR: Backend container not found."

                sudo docker compose ps

                exit 1

            fi


            BACKEND_STATUS=$(sudo docker inspect \
                --format='{{.State.Status}}' \
                "$BACKEND_CONTAINER")

            echo "Backend status:"
            echo "$BACKEND_STATUS"


            if [ "$BACKEND_STATUS" != "running" ]; then

                echo ""
                echo "ERROR: Backend container is not running."

                sudo docker compose logs --tail=200 backend

                exit 1

            fi


            echo ""
            echo "Backend container is running."


            # ==================================================
            # DJANGO SYSTEM CHECK
            # ==================================================

            echo ""
            echo "Running Django system check..."

            sudo docker compose exec -T backend \
                python manage.py check

            echo "Django system check passed."


            # ==================================================
            # HEALTH ENDPOINT
            # ==================================================

            echo ""
            echo "Checking Django health endpoint..."

            HTTP_STATUS=$(curl \
                --connect-timeout 10 \
                --max-time 15 \
                --silent \
                --output /dev/null \
                --write-out "%{http_code}" \
                http://127.0.0.1:8002/health \
                || true)

            echo ""
            echo "Health endpoint HTTP status:"
            echo "$HTTP_STATUS"


            if [ "$HTTP_STATUS" != "200" ]; then

                echo ""
                echo "ERROR: Health check failed."

                echo ""
                echo "Docker status:"

                sudo docker compose ps

                echo ""
                echo "Backend logs:"

                sudo docker compose logs --tail=200 backend

                exit 1

            fi


            echo ""
            echo "Django health check PASSED."


            # ==================================================
            # SUCCESS
            # ==================================================

            echo ""
            echo "=================================================="
            echo "APPLICATION IS HEALTHY"
            echo "=================================================="

            # ==================================================
            # SUCCESS
            # ==================================================

            echo ""
            echo "=================================================="
            echo "       DEPLOYMENT SUCCESSFUL"
            echo "=================================================="

            echo ""
            echo "Application:"
            echo "$APP_DIR"

            echo ""
            echo "URL:"
            echo "http://140.245.238.244:8002/"

            echo ""
            echo "Production .env:"
            echo "PRESERVED"

            echo ""
            echo "Deployment completed successfully."
