name: Deploy DonationApp to Oracle Cloud

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script_stop: true

          script: |

            set -e

            echo "=========================================="
            echo "DONATION APP DEPLOYMENT"
            echo "=========================================="

            echo ""
            echo "Hostname:"
            hostname

            echo ""
            echo "User ID:"
            id -u

            echo ""
            echo "Group ID:"
            id -g

            echo ""
            echo "Home directory:"
            HOME_DIR="$(getent passwd "$(id -u)" | cut -d: -f6)"
            echo "$HOME_DIR"

            echo ""
            echo "Current user:"
            id -un


            # ==========================================
            # APPLICATION PATH
            # ==========================================

            APP_DIR="$HOME_DIR/donation"

            echo ""
            echo "Application directory:"
            echo "$APP_DIR"


            # ==========================================
            # DOCKER
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING DOCKER"
            echo "=========================================="

            sudo docker --version
            sudo docker compose version

            echo "Docker service:"
            sudo systemctl is-active docker


            # ==========================================
            # PREPARE DIRECTORY
            # ==========================================

            echo ""
            echo "=========================================="
            echo "PREPARING APPLICATION DIRECTORY"
            echo "=========================================="

            echo "Creating directory using sudo..."

            sudo mkdir -p "$APP_DIR"

            echo "Directory created."

            echo "Setting directory ownership..."

            sudo chown "$(id -u):$(id -g)" "$APP_DIR"

            echo "Ownership updated."

            echo ""
            echo "Directory permissions:"

            ls -ld "$APP_DIR"


            # ==========================================
            # GIT CHECK
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING GIT"
            echo "=========================================="

            if ! command -v git >/dev/null 2>&1; then

              echo "Git is not installed."
              echo "Installing Git..."

              sudo apt-get update
              sudo apt-get install -y git

            fi

            git --version


            # ==========================================
            # CLONE / UPDATE
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING GIT REPOSITORY"
            echo "=========================================="

            if [ ! -d "$APP_DIR/.git" ]; then

              echo "Repository does not exist."
              echo "Cloning DonationApp..."

              sudo rm -rf "$APP_DIR"

              git clone \
                https://github.com/Prateekpatil948/DonationApp.git \
                "$APP_DIR"

              sudo chown -R "$(id -u):$(id -g)" "$APP_DIR"

              echo ""
              echo "Repository cloned successfully."

            else

              echo "Repository already exists."

              cd "$APP_DIR"

              git fetch origin

              git reset --hard origin/main

              echo ""
              echo "Repository updated successfully."

            fi


            # ==========================================
            # ENTER PROJECT
            # ==========================================

            cd "$APP_DIR"

            echo ""
            echo "=========================================="
            echo "APPLICATION"
            echo "=========================================="

            echo "Application path:"
            pwd

            echo ""
            echo "Git remote:"
            git remote -v

            echo ""
            echo "Latest commit:"
            git log -1 --oneline

            echo ""
            echo "Application files:"
            ls -la


            # ==========================================
            # DOCKER COMPOSE
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING DOCKER COMPOSE"
            echo "=========================================="

            if [ ! -f docker-compose.yml ]; then

              echo "ERROR: docker-compose.yml not found!"

              exit 1

            fi

            echo "docker-compose.yml found."


            # ==========================================
            # ENVIRONMENT
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING .ENV"
            echo "=========================================="

            if [ ! -f .env ]; then

              echo ".env does not exist."

              touch .env

              echo ".env created."

            else

              echo ".env already exists."

            fi


            # ==========================================
            # DOCKER COMPOSE VALIDATION
            # ==========================================

            echo ""
            echo "=========================================="
            echo "VALIDATING DOCKER COMPOSE"
            echo "=========================================="

            sudo docker compose config


            # ==========================================
            # STOP OLD CONTAINERS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "STOPPING OLD CONTAINERS"
            echo "=========================================="

            sudo docker compose down


            # ==========================================
            # BUILD
            # ==========================================

            echo ""
            echo "=========================================="
            echo "BUILDING DOCKER IMAGES"
            echo "=========================================="

            sudo docker compose build --pull


            # ==========================================
            # START
            # ==========================================

            echo ""
            echo "=========================================="
            echo "STARTING CONTAINERS"
            echo "=========================================="

            sudo docker compose up -d


            # ==========================================
            # WAIT
            # ==========================================

            echo ""
            echo "=========================================="
            echo "WAITING FOR CONTAINERS"
            echo "=========================================="

            sleep 15


            # ==========================================
            # STATUS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CONTAINER STATUS"
            echo "=========================================="

            sudo docker compose ps


            # ==========================================
            # BACKEND LOGS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "BACKEND LOGS"
            echo "=========================================="

            sudo docker compose logs --tail=100 backend


            # ==========================================
            # MIGRATIONS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "RUNNING MIGRATIONS"
            echo "=========================================="

            sudo docker compose exec -T backend \
              python manage.py migrate --noinput


            # ==========================================
            # STATIC FILES
            # ==========================================

            echo ""
            echo "=========================================="
            echo "COLLECTING STATIC FILES"
            echo "=========================================="

            sudo docker compose exec -T backend \
              python manage.py collectstatic --noinput


            # ==========================================
            # FINAL STATUS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "FINAL STATUS"
            echo "=========================================="

            sudo docker compose ps


            echo ""
            echo "=========================================="
            echo "    DEPLOYMENT SUCCESSFUL"
            echo "=========================================="
