name: Deploy DonationApp to Oracle Cloud

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: donation-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # DEPLOY TO ORACLE
      # ============================================================

      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22

          script_stop: true

          script: |

            set -e

            echo "=================================================="
            echo "        DONATION APP - PRODUCTION DEPLOYMENT"
            echo "=================================================="


            # ==================================================
            # CONFIGURATION
            # ==================================================

            APP_DIR="/donation"
            REPO_URL="https://github.com/Prateekpatil948/DonationApp.git"
            BRANCH="main"

            echo ""
            echo "Application directory:"
            echo "$APP_DIR"

            echo ""
            echo "Repository:"
            echo "$REPO_URL"

            echo ""
            echo "Branch:"
            echo "$BRANCH"


            # ==================================================
            # SERVER INFORMATION
            # ==================================================

            echo ""
            echo "=================================================="
            echo "SERVER INFORMATION"
            echo "=================================================="

            echo "Hostname:"
            hostname

            echo ""
            echo "User:"
            id -un

            echo ""
            echo "User ID:"
            id -u

            echo ""
            echo "Operating System:"
            uname -a


            # ==================================================
            # DEPLOYMENT LOCK
            # ==================================================

            echo ""
            echo "=================================================="
            echo "DEPLOYMENT LOCK"
            echo "=================================================="

            exec 9>/tmp/donation-deployment.lock

            if ! flock -n 9; then
                echo "Another deployment is already running."
                echo "Stopping this deployment."
                exit 1
            fi

            echo "Deployment lock acquired."


            # ==================================================
            # CHECK DOCKER
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CHECKING DOCKER"
            echo "=================================================="

            sudo docker --version

            sudo docker compose version

            if ! sudo systemctl is-active --quiet docker; then

                echo "Docker is not running."
                echo "Starting Docker..."

                sudo systemctl start docker

            fi

            echo "Docker is running."


            # ==================================================
            # PREPARE APPLICATION DIRECTORY
            # ==================================================

            echo ""
            echo "=================================================="
            echo "PREPARING APPLICATION DIRECTORY"
            echo "=================================================="

            if [ ! -d "$APP_DIR" ]; then

                echo "Application directory does not exist."

                echo "Creating:"
                echo "$APP_DIR"

                sudo mkdir -p "$APP_DIR"

                sudo chown "$(id -u):$(id -g)" "$APP_DIR"

                echo "Application directory created."

            else

                echo "Application directory already exists."

            fi


            # ==================================================
            # INITIAL CLONE
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CHECKING REPOSITORY"
            echo "=================================================="

            if [ ! -d "$APP_DIR/.git" ]; then

                echo "Git repository does not exist."

                echo "Performing first clone..."

                # ------------------------------------------------
                # Clone into temporary directory.
                #
                # This avoids deleting anything from /donation.
                # ------------------------------------------------

                TEMP_DIR="/tmp/donation-initial-clone"

                sudo rm -rf "$TEMP_DIR"

                git clone \
                  --branch "$BRANCH" \
                  --single-branch \
                  "$REPO_URL" \
                  "$TEMP_DIR"

                echo "Repository cloned."


                # ------------------------------------------------
                # IMPORTANT:
                # Never overwrite .env.
                # ------------------------------------------------

                if [ -f "$APP_DIR/.env" ]; then

                    echo ""
                    echo ".env already exists."
                    echo "Preserving production .env."

                    rm -rf "$TEMP_DIR/.env"

                fi


                # ------------------------------------------------
                # Copy repository into application directory.
                # ------------------------------------------------

                cp -a "$TEMP_DIR"/. "$APP_DIR"/

                rm -rf "$TEMP_DIR"

                sudo chown -R "$(id -u):$(id -g)" "$APP_DIR"

                echo "Initial deployment completed."

            else

                echo "Git repository already exists."

            fi


            # ==================================================
            # ENTER APPLICATION DIRECTORY
            # ==================================================

            cd "$APP_DIR"

            echo ""
            echo "Current directory:"
            pwd


            # ==================================================
            # PROTECT .ENV
            # ==================================================

            echo ""
            echo "=================================================="
            echo "PROTECTING PRODUCTION .ENV"
            echo "=================================================="

            if [ ! -f "$APP_DIR/.env" ]; then

                echo ""
                echo "ERROR: Production .env file does not exist."
                echo ""
                echo "Deployment stopped."
                echo "Create /donation/.env on the Oracle server first."
                echo ""

                exit 1

            fi

            echo ".env exists."


            # ------------------------------------------------
            # Make sure .env is NOT tracked by Git.
            # ------------------------------------------------

            if git ls-files --error-unmatch .env >/dev/null 2>&1; then

                echo ""
                echo "ERROR: .env is tracked by Git."
                echo ""
                echo "For production safety, .env must NOT be committed."
                echo "Remove .env from Git tracking and add it to .gitignore."
                echo ""

                exit 1

            fi

            echo ".env is not tracked by Git."


            # ==================================================
            # UPDATE SOURCE CODE
            # ==================================================

            echo ""
            echo "=================================================="
            echo "UPDATING SOURCE CODE"
            echo "=================================================="

            git fetch origin "$BRANCH"

            git checkout "$BRANCH"
