            echo ""
            echo "=================================================="
            echo "DEPLOYED COMMIT"
            echo "=================================================="

            git log -1 --oneline


            # ==================================================
            # VERIFY .ENV AFTER GIT UPDATE
            # ==================================================

            echo ""
            echo "=================================================="
            echo "VERIFYING PRODUCTION .ENV"
            echo "=================================================="

            if [ ! -f "$APP_DIR/.env" ]; then

                echo "ERROR: .env disappeared during deployment."

                exit 1

            fi

            echo ".env is still present."

            echo ""
            echo "Checking required environment variables..."

            REQUIRED_ENV_VARS="
            DJANGO_SETTINGS_MODULE
            SECRET_KEY
            ALLOWED_HOSTS
            "

            for VAR in $REQUIRED_ENV_VARS; do

                if ! grep -q "^${VAR}=" "$APP_DIR/.env"; then

                    echo "WARNING: $VAR is not present in .env"

                else

                    echo "$VAR is configured."

                fi

            done


            # ==================================================
            # CHECK DOCKER COMPOSE
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CHECKING DOCKER COMPOSE"
            echo "=================================================="

            if [ ! -f "$APP_DIR/docker-compose.yml" ]; then

                echo "ERROR: docker-compose.yml not found."

                exit 1

            fi

            echo "docker-compose.yml found."


            # ==================================================
            # VALIDATE DOCKER COMPOSE
            # ==================================================

            echo ""
            echo "=================================================="
            echo "VALIDATING DOCKER COMPOSE"
            echo "=================================================="

            sudo docker compose config >/dev/null

            echo "Docker Compose configuration is valid."


            # ==================================================
            # BUILD DOCKER IMAGES
            # ==================================================

            echo ""
            echo "=================================================="
            echo "BUILDING DOCKER IMAGES"
            echo "=================================================="

            sudo docker compose build --pull


            # ==================================================
            # START / UPDATE APPLICATION
            # ==================================================

            echo ""
            echo "=================================================="
            echo "STARTING / UPDATING CONTAINERS"
            echo "=================================================="

            sudo docker compose up -d --remove-orphans


            # ==================================================
            # WAIT FOR CONTAINERS
            # ==================================================

            echo ""
            echo "=================================================="
            echo "WAITING FOR CONTAINERS"
            echo "=================================================="

            sleep 15


            # ==================================================
            # CONTAINER STATUS
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CONTAINER STATUS"
            echo "=================================================="

            sudo docker compose ps


            # ==================================================
            # CHECK BACKEND HEALTH
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CHECKING BACKEND"
            echo "=================================================="

            BACKEND_STATUS=$(sudo docker inspect \
              --format='{{.State.Status}}' \
              "$(sudo docker compose ps -q backend)" \
              2>/dev/null || true)

            echo "Backend status:"
            echo "$BACKEND_STATUS"

            if [ "$BACKEND_STATUS" != "running" ]; then

                echo ""
                echo "ERROR: Backend container is not running."

                sudo docker compose logs --tail=200 backend

                exit 1

            fi

            echo "Backend container is running."


            # ==================================================
            # WAIT FOR POSTGRESQL
            # ==================================================

            echo ""
            echo "=================================================="
            echo "CHECKING DATABASE"
            echo "=================================================="

            DB_STATUS=$(sudo docker inspect \
              --format='{{.State.Health.Status}}' \
              "$(sudo docker compose ps -q db)" \
              2>/dev/null || true)

            echo "Database health:"
            echo "$DB_STATUS"


            # ==================================================
            # RUN DATABASE MIGRATIONS
            # ==================================================

            echo ""
            echo "=================================================="
            echo "RUNNING DATABASE MIGRATIONS"
            echo "=================================================="

            sudo docker compose exec -T backend \
              python manage.py migrate --noinput

            echo "Migrations completed."


            # ==================================================
            # COLLECT STATIC FILES
            # ==================================================

            echo ""
            echo "=================================================="
            echo "COLLECTING STATIC FILES"
            echo "=================================================="

            sudo docker compose exec -T backend \
              python manage.py collectstatic --noinput

            echo "Static files collected."


            # ==================================================
            # FINAL CONTAINER STATUS
            # ==================================================

            echo ""
            echo "=================================================="
            echo "FINAL CONTAINER STATUS"
            echo "=================================================="

            sudo docker compose ps


            # ==================================================
            # FINAL HEALTH CHECK
            # ==================================================

            echo ""
            echo "=================================================="
            echo "FINAL APPLICATION CHECK"
            echo "=================================================="

            HTTP_STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              http://127.0.0.1:8002/ \
              || true)

            echo "Application HTTP status:"
            echo "$HTTP_STATUS"

            if [ "$HTTP_STATUS" = "000" ]; then

                echo ""
                echo "WARNING: Application did not respond on port 8002."

                echo ""
                echo "Backend logs:"

                sudo docker compose logs --tail=100 backend

                exit 1

            fi


            # ==================================================
            # SUCCESS
            # ==================================================

            echo ""
            echo "=================================================="
            echo "       DEPLOYMENT SUCCESSFUL"
            echo "=================================================="

            echo ""
            echo "Application directory:"
            echo "$APP_DIR"

            echo ""
            echo "Application URL:"
            echo "http://140.245.238.244:8002/"

            echo ""
            echo "Production .env:"
            echo "PRESERVED"

            echo ""
            echo "PostgreSQL volumes:"
            echo "PRESERVED"

            echo ""
            echo "Deployment completed successfully."
