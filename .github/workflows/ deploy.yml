name: Deploy DonationApp to Oracle Cloud

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script_stop: true

          script: |

            set -e

            echo "=========================================="
            echo "DONATION APP DEPLOYMENT"
            echo "=========================================="

            echo ""
            echo "Hostname:"
            hostname

            echo ""
            echo "Current directory:"
            pwd

            echo ""
            echo "Checking operating system:"
            uname -a


            # ==========================================
            # DOCKER
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING DOCKER"
            echo "=========================================="

            sudo docker --version
            sudo docker compose version

            echo "Docker service:"
            sudo systemctl is-active docker


            # ==========================================
            # APPLICATION DIRECTORY
            # ==========================================

            echo ""
            echo "=========================================="
            echo "PREPARING APPLICATION DIRECTORY"
            echo "=========================================="

            APP_DIR="/home/ubuntu/donation"

            echo "Application directory:"
            echo "$APP_DIR"

            if [ ! -d "$APP_DIR" ]; then
              echo "Directory does not exist."
              echo "Creating directory..."

              sudo mkdir -p "$APP_DIR"
              sudo chown -R ubuntu:ubuntu "$APP_DIR"

              echo "Directory created."
            else
              echo "Directory already exists."
            fi

            echo ""
            echo "Directory contents:"
            ls -la "$APP_DIR"


            # ==========================================
            # GIT
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING GIT"
            echo "=========================================="

            if ! command -v git >/dev/null 2>&1; then
              echo "Git is not installed."

              sudo apt-get update
              sudo apt-get install -y git

            else
              echo "Git is already installed."
            fi

            git --version


            # ==========================================
            # CLONE / UPDATE REPOSITORY
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING GIT REPOSITORY"
            echo "=========================================="

            if [ ! -d "$APP_DIR/.git" ]; then

              echo "Repository does not exist."
              echo "Cloning DonationApp..."

              sudo rm -rf "$APP_DIR"

              git clone \
                https://github.com/Prateekpatil948/DonationApp.git \
                "$APP_DIR"

              echo "Repository cloned successfully."

            else

              echo "Repository already exists."
              echo "Updating repository..."

              cd "$APP_DIR"

              git fetch origin

              git reset --hard origin/main

              echo "Repository updated successfully."

            fi


            # ==========================================
            # APPLICATION DIRECTORY
            # ==========================================

            cd "$APP_DIR"

            echo ""
            echo "=========================================="
            echo "APPLICATION"
            echo "=========================================="

            echo "Application path:"
            pwd

            echo ""
            echo "Git remote:"
            git remote -v

            echo ""
            echo "Latest commit:"
            git log -1 --oneline

            echo ""
            echo "Application files:"
            ls -la


            # ==========================================
            # DOCKER COMPOSE
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING DOCKER COMPOSE"
            echo "=========================================="

            if [ ! -f "$APP_DIR/docker-compose.yml" ]; then

              echo "ERROR:"
              echo "docker-compose.yml was not found."

              exit 1

            fi

            echo "docker-compose.yml found."


            # ==========================================
            # ENVIRONMENT FILE
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING .ENV"
            echo "=========================================="

            if [ ! -f "$APP_DIR/.env" ]; then

              echo ".env does not exist."

              echo "Creating .env..."

              touch "$APP_DIR/.env"

            else

              echo ".env already exists."

            fi


            # ==========================================
            # DOCKER COMPOSE VALIDATION
            # ==========================================

            echo ""
            echo "=========================================="
            echo "VALIDATING DOCKER COMPOSE"
            echo "=========================================="

            cd "$APP_DIR"

            sudo docker compose config


            # ==========================================
            # STOP OLD CONTAINERS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "STOPPING OLD CONTAINERS"
            echo "=========================================="

            sudo docker compose down


            # ==========================================
            # BUILD
            # ==========================================

            echo ""
            echo "=========================================="
            echo "BUILDING DOCKER IMAGES"
            echo "=========================================="

            sudo docker compose build --pull


            # ==========================================
            # START
            # ==========================================

            echo ""
            echo "=========================================="
            echo "STARTING CONTAINERS"
            echo "=========================================="

            sudo docker compose up -d


            # ==========================================
            # WAIT
            # ==========================================

            echo ""
            echo "=========================================="
            echo "WAITING FOR CONTAINERS"
            echo "=========================================="

            sleep 15


            # ==========================================
            # STATUS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CONTAINER STATUS"
            echo "=========================================="

            sudo docker compose ps


            # ==========================================
            # BACKEND LOGS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "BACKEND LOGS"
            echo "=========================================="

            sudo docker compose logs --tail=100 backend


            # ==========================================
            # MIGRATIONS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "RUNNING MIGRATIONS"
            echo "=========================================="

            sudo docker compose exec -T backend \
              python manage.py migrate --noinput


            # ==========================================
            # STATIC FILES
            # ==========================================

            echo ""
            echo "=========================================="
            echo "COLLECTING STATIC FILES"
            echo "=========================================="

            sudo docker compose exec -T backend \
              python manage.py collectstatic --noinput


            # ==========================================
            # FINAL STATUS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "FINAL STATUS"
            echo "=========================================="

            sudo docker compose ps


            echo ""
            echo "=========================================="
            echo "DEPLOYMENT SUCCESSFUL"
            echo "=========================================="
