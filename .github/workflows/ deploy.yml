name: Deploy DonationApp to Oracle Cloud

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout GitHub repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Deploy to Oracle VM
      # --------------------------------------------------

      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22

          script_stop: true

          script: |

            set -e

            echo "=========================================="
            echo "      DONATION APP DEPLOYMENT"
            echo "=========================================="

            echo ""
            echo "Server:"
            hostname

            echo ""
            echo "User:"
            whoami


            # ==================================================
            # Docker
            # ==================================================

            echo ""
            echo "=========================================="
            echo "CHECKING DOCKER"
            echo "=========================================="

            sudo docker --version

            sudo docker compose version

            if ! sudo systemctl is-active --quiet docker; then
                echo "Docker is not running."
                echo "Starting Docker..."

                sudo systemctl start docker
            fi

            echo "Docker is running."


            # ==================================================
            # Application directory
            # ==================================================

            echo ""
            echo "=========================================="
            echo "PREPARING APPLICATION DIRECTORY"
            echo "=========================================="

            APP_DIR="/home/ubuntu/donation"

            echo "Application directory:"
            echo "$APP_DIR"

            mkdir -p "$APP_DIR"


            # ==================================================
            # Clone repository
            # ==================================================

            echo ""
            echo "=========================================="
            echo "CHECKING REPOSITORY"
            echo "=========================================="

            if [ ! -d "$APP_DIR/.git" ]; then

                echo "Repository does not exist."
                echo "Cloning DonationApp..."

                rm -rf "$APP_DIR"

                git clone \
                  https://github.com/Prateekpatil948/DonationApp.git \
                  "$APP_DIR"

            else

                echo "Repository already exists."

            fi


            # ==================================================
            # Enter project
            # ==================================================

            cd "$APP_DIR"

            echo ""
            echo "Application directory:"
            pwd

            echo ""
            echo "Application files:"
            ls -la


            # ==================================================
            # Update repository
            # ==================================================

            echo ""
            echo "=========================================="
            echo "UPDATING SOURCE CODE"
            echo "=========================================="

            git fetch origin

            git reset --hard origin/main

            echo ""
            echo "Current commit:"
            git log -1 --oneline


            # ==================================================
            # Check Docker Compose
            # ==================================================

            echo ""
            echo "=========================================="
            echo "CHECKING DOCKER COMPOSE"
            echo "=========================================="

            if [ ! -f docker-compose.yml ]; then

                echo "ERROR: docker-compose.yml not found."

                exit 1

            fi

            echo "docker-compose.yml found."


            # ==================================================
            # Check .env
            # ==================================================

            echo ""
            echo "=========================================="
            echo "CHECKING ENVIRONMENT FILE"
            echo "=========================================="

            if [ ! -f .env ]; then

                echo ".env does not exist."

                echo "Creating .env..."

                touch .env

            else

                echo ".env already exists."

            fi


            # ==================================================
            # Validate Docker Compose
            # ==================================================

            echo ""
            echo "=========================================="
            echo "VALIDATING DOCKER COMPOSE"
            echo "=========================================="

            sudo docker compose config


            # ==================================================
            # Stop old containers
            # ==================================================

            echo ""
            echo "=========================================="
            echo "STOPPING OLD CONTAINERS"
            echo "=========================================="

            sudo docker compose down


            # ==================================================
            # Build containers
            # ==================================================

            echo ""
            echo "=========================================="
            echo "BUILDING DOCKER CONTAINERS"
            echo "=========================================="

            sudo docker compose build --pull


            # ==================================================
            # Start containers
            # ==================================================

            echo ""
            echo "=========================================="
            echo "STARTING DOCKER CONTAINERS"
            echo "=========================================="

            sudo docker compose up -d


            # ==================================================
            # Wait for services
            # ==================================================

            echo ""
            echo "=========================================="
            echo "WAITING FOR SERVICES"
            echo "=========================================="

            sleep 15


            # ==================================================
            # Container status
            # ==================================================

            echo ""
            echo "=========================================="
            echo "CONTAINER STATUS"
            echo "=========================================="

            sudo docker compose ps


            # ==================================================
            # Backend logs
            # ==================================================

            echo ""
            echo "=========================================="
            echo "BACKEND LOGS"
            echo "=========================================="

            sudo docker compose logs --tail=100 backend


            # ==================================================
            # Database logs
            # ==================================================

            echo ""
            echo "=========================================="
            echo "DATABASE LOGS"
            echo "=========================================="

            sudo docker compose logs --tail=50 db


            # ==================================================
            # Django migrations
            # ==================================================

            echo ""
            echo "=========================================="
            echo "RUNNING DATABASE MIGRATIONS"
            echo "=========================================="

            sudo docker compose exec -T backend \
              python manage.py migrate --noinput


            # ==================================================
            # Collect static files
            # ==================================================

            echo ""
            echo "=========================================="
            echo "COLLECTING STATIC FILES"
            echo "=========================================="

            sudo docker compose exec -T backend \
              python manage.py collectstatic --noinput


            # ==================================================
            # Final status
            # ==================================================

            echo ""
            echo "=========================================="
            echo "FINAL CONTAINER STATUS"
            echo "=========================================="

            sudo docker compose ps


            # ==================================================
            # Deployment complete
            # ==================================================

            echo ""
            echo "=========================================="
            echo "    DEPLOYMENT SUCCESSFUL"
            echo "=========================================="

            echo ""
            echo "DonationApp is now running on Oracle Cloud."
