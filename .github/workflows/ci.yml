name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  SECRET_KEY: ci-secret-key
  DATABASE_HOST: localhost
  DATABASE_PORT: "5432"
  DATABASE_USER: ra_user
  DATABASE_PASSWORD: ra_password
  TEST_DATABASE_NAME: ra_backend_test

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: black
        run: black --check .
      - name: isort
        run: isort --check-only .
      - name: flake8
        run: flake8 .
      - name: mypy
        run: mypy apps core services utils config

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ra_backend_test
          POSTGRES_USER: ra_user
          POSTGRES_PASSWORD: ra_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ra_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      # redis:
      #   image: redis:7-alpine
      #   ports:
      #     - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run tests with coverage
        run: pytest
      - name: Enforce coverage threshold
        run: coverage report --fail-under=90
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
        if: always()

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: ra-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
